const PANELW=330;

function vws(){return W-(panelOpen()?PANELW:0)}               // the width actually visible

function step(){
  const V=N.filter(visible),k=hot>0?1:.32;
  for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++){
    const a=V[i],b=V[j];
    /* A gathered dot is pinned on its ring: it must not push or pull anything, or clicking one
       argument rearranges the whole map and the view has to re-fit away from where you were. */
    if(gathered&&(gathered.has(a)||gathered.has(b)))continue;
    let dx=a.x-b.x,dy=a.y-b.y;const d2=dx*dx+dy*dy+1;
    if(d2>640000)continue;
    const rank=(x)=>(x.kind==='s'?0:(x.kind==='i'?1:2));
    const apart=(a.themeId&&b.themeId&&a.themeId!==b.themeId)
      ?((a.kind==='x'&&b.kind==='x')?2.6:1.6):1;      // themes become visible clouds
    /* Repulsion by kind. Ideas used to sit in the middle pushing topics at the topic rate,
       which blew the whole map out to twice the height it needed. */
    const s=(rank(a)===0&&rank(b)===0)?260
      :((rank(a)===0||rank(b)===0)?700
      :((a.kind==='i'&&b.kind==='i')?9000:((a.kind==='i'||b.kind==='i')?6000:40000)));
    const sh=s*apart;
    const d=Math.sqrt(d2),f=sh/d2;dx=dx/d*f;dy=dy/d*f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy}
  byTheme.forEach((list,th)=>{                    // each theme's topics hold to their anchor
    const a=ANCH[th];if(!a||!list.length)return;
    list.forEach(t=>{t.vx+=(a.x-t.x)*.009;t.vy+=(a.y-t.y)*.009})});
  const sp=(a,b,L,k2)=>{const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-L)*k2;
    a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f};
  LK.forEach(l=>{if(!visible(l.a)||!visible(l.b))return;
    if(gathered&&(gathered.has(l.a)||gathered.has(l.b)))return;
    if(l.t==='tt')sp(l.a,l.b,255,.035);
    else if(l.t==='xx')sp(l.a,l.b,210,.015);
    else if(l.t==='it')sp(l.a,l.b,70,.03);
    else sp(l.a,l.b,88,.02)});
  V.forEach(n=>{
    if(n.kind==='s'){const p=xid[n.topic];if(p)sp(n,p,48,.09)}
    if(n.kind==='i'){const nb=evidenceOf.get(n.id)||[];
      if(nb.length){let cx=0,cy=0;nb.forEach(s=>{cx+=s.x;cy+=s.y});
        sp(n,{x:cx/nb.length,y:cy/nb.length},60,.008)}}
    n.vx-=n.x*.0016;n.vy-=n.y*.0016;n.vx*=.82;n.vy*=.82;
    const v=Math.hypot(n.vx,n.vy);if(v>9){n.vx*=9/v;n.vy*=9/v}
    n.x+=n.vx*k*1.35;n.y+=n.vy*k*.62;     // the canvas is wide; the map should be too
    const dd=Math.hypot(n.x,n.y);         // a hard field edge: no node may run for a corner
    if(dd>2600){n.x*=2600/dd;n.y*=2600/dd;n.vx*=.2;n.vy*=.2}});
  placeRings()}

  key(ns=>{const l1=document.createElementNS(ns,'line');l1.setAttribute('x1','-7');l1.setAttribute('x2','7');
    l1.setAttribute('stroke','#000');l1.setAttribute('stroke-width','2');return l1},'a chain: press path, then two nodes');
  key(ns=>{const l1=document.createElementNS(ns,'line');l1.setAttribute('x1','-7');l1.setAttribute('x2','7');
    l1.setAttribute('stroke','#000');l1.setAttribute('stroke-opacity','.35');return l1},
    'text to topic (membership)');
  key(ns=>{const l1=document.createElementNS(ns,'line');l1.setAttribute('x1','-7');l1.setAttribute('x2','7');
    l1.setAttribute('stroke','#000');l1.setAttribute('stroke-dasharray','4 3');return l1},
    'topic to topic (shared tags)');
  key(ns=>{const g=document.createElementNS(ns,'g');
    const a=document.createElementNS(ns,'circle');a.setAttribute('cx','-7');a.setAttribute('r','1.6');a.setAttribute('fill','#000');
    const b=document.createElementNS(ns,'circle');b.setAttribute('cx','7');b.setAttribute('r','1.6');b.setAttribute('fill','#000');
    const l1=document.createElementNS(ns,'line');l1.setAttribute('x1','-6');l1.setAttribute('x2','6');
    l1.setAttribute('stroke','#000');l1.setAttribute('stroke-dasharray','1 3');
    g.appendChild(l1);g.appendChild(a);g.appendChild(b);return g},'argument to argument (shared evidence)');
  if(!showIdeas)ideaKey.classList.add('off')}

function search(){
  const q=$('#q').value.trim().toLowerCase();hits.clear();
  if(q.length>1){
    const m=(s)=>String(s).toLowerCase().indexOf(q)>=0;
    S.forEach(s=>{if(m(s.title+' '+s.author+' '+s.topic+' '+(s.tags||[]).join(' ')+' '+(s.note||'')))hits.add(s)});
    I.forEach(v=>{if(m(v.title+' '+v.tags))hits.add(v)});
    TX.forEach(t=>{if(m(t.label))hits.add(t)});
    hits.forEach(n=>{if(n.kind==='s'){const p=xid[n.topic];if(p&&!p.open)openTopic(p,true)}
      if(n.kind==='i'){(evidenceOf.get(n.id)||[]).forEach(s=>{const p=xid[s.topic];if(p&&!p.open)openTopic(p,true)})}});
    const first=Array.from(hits)[0];if(first)go={x:first.x,y:first.y}}
  $('#n').textContent=hits.size?hits.size+' matches':DATA.count+' texts';
  dirty=1}
function hashWrite(){
  const open=TX.filter(t=>t.open).map(t=>t.id),parts=[];
  if(sel)parts.push('s='+encodeURIComponent(sel.id));
  if(open.length)parts.push('o='+open.map(encodeURIComponent).join(','));
  if(off.size)parts.push('h='+Array.from(off).map(encodeURIComponent).join(','));
  if(!showIdeas)parts.push('i=0');
  try{history.replaceState(null,'','#'+parts.join('&'))}catch(_e){/* file:// refuses */}
}
function hashRead(){
  const h=location.hash.replace(/^#/,'');if(!h)return;
  const get=(k)=>{const m=h.match(new RegExp('(?:^|&)'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):''};
  get('h').split(',').filter(Boolean).forEach(t=>off.add(t));
  if(get('i')==='0')showIdeas=false;
  get('o').split(',').filter(Boolean).forEach(t=>{if(xid[t])openTopic(xid[t],true)});
  const s=get('s');if(s){const n=sid[s]||iid[s]||xid[s]||tid[s];if(n){pick(n,true);go={x:n.x,y:n.y}}}}

const HINT='click a topic to open it \u00b7 click an argument to gather its evidence \u00b7 empty click releases \u00b7 drag to pan, scroll to zoom';
$('#q').addEventListener('input',search);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const first=Array.from(hits)[0];
  if(first){pick(first);go={x:first.x,y:first.y}}}});
$('#ea').onclick=()=>{needFit=1;TX.forEach(t=>openTopic(t,true));showIdeas=true;$('#id').classList.add('on');
  hot=280;setTimeout(()=>fitTo(),420)};
$('#ca').onclick=()=>{needFit=1;TX.forEach(t=>openTopic(t,false));hot=160;setTimeout(()=>fitTo(),360)};
$('#ft').onclick=()=>{focus=null;fitTo()};
$('#cl').onclick=()=>{hover=null;hits.clear();$('#q').value='';
  $('#n').textContent=DATA.count+' texts';path=null;pathIdx=null;pathEdges=null;pathA=null;pathArmed=false;
  $('#ph').classList.remove('on');showPanel(null);hot=Math.max(hot,90);dirty=1};
$('#gp').onclick=()=>gaps();
$('#ph').onclick=()=>{pathArmed=!pathArmed;pathA=null;path=null;pathIdx=null;pathEdges=null;
  $('#ph').classList.toggle('on',pathArmed);
  $('#hint').textContent=pathArmed?'click two nodes to see what connects them':HINT;
  dirty=1};
$('#id').onclick=()=>{showIdeas=!showIdeas;$('#id').classList.toggle('on',showIdeas);
  hot=Math.max(hot,140);document.querySelectorAll('#legend .lg').forEach(e=>{});
  dirty=1};
$('#cp').onclick=()=>{const b=$('#cp'),back=()=>{b.textContent='link to this view'};
  try{navigator.clipboard.writeText(location.href).then(()=>{b.textContent='copied';
      setTimeout(back,1200)},()=>{b.textContent='copy blocked — use the address bar'})}
  catch(_e){b.textContent='copy blocked — use the address bar'}};
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{
  if(/input|textarea|select/i.test(e.target.tagName||''))return;
  if(e.key==='Escape'){path=null;pathIdx=null;pathEdges=null;showPanel(null);hot=Math.max(hot,90);dirty=1}
  if(e.key==='i'){$('#id').click()}});
setInterval(()=>{if(document.body.dataset.panel==='1')hashWrite()},1500);

function tick(){raf=0;
  if(go){cam.x+=(go.x-cam.x)*.16;cam.y+=(go.y-cam.y)*.16;
    if(Math.hypot(go.x-cam.x,go.y-cam.y)<2)go=null;dirty=1}
  if(hot>0){step();hot--;if(hot===0&&(needFit||!fitted)){fitted=1;needFit=0;fitTo()}dirty=1}
  if(dirty){draw();dirty=0}
  raf=requestAnimationFrame(tick)}
try{
  resize();showPanel(null);legend();hashRead();$('#n').textContent=DATA.count+' texts';
  for(let i=0;i<420;i++)step();fitTo();tick();
}catch(e){window.__err=String(e);
  const d=document.createElement('div');d.id='err';d.textContent='the map failed to start: '+e;
  document.body.appendChild(d)}
</script>
</body></html>
