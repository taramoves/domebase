<script>
const N=[1,2,20,40,40,80,80,80,80,80,80,80],CX=340,K=3.38,rad=Math.PI/180,C=['#fff','#e5484d','#f5c518','#2f6fed','#000'];
const def=()=>({w:[2.7,5.4,null,null,null,null,null,null,null,null,null,null],col:{},circ:[{d:20,dia:6},{d:45,dia:6}],az:45,
spk:[{n:1,r:0,o:0,w:8,h:10,cap:0},{n:4,r:22,o:0,w:8,h:10,cap:0},{n:8,r:34,o:0,w:8,h:10,cap:0},{n:16,r:47,o:0,w:8,h:10,cap:0},{n:32,r:62,o:0,w:8,h:10,cap:4},{n:32,r:80,o:0,w:8,h:10,cap:1}],
lfe:[[],[],[],[],[],[]],show:{p:1,c:1,s:1,n:1,t:0},op:100});
let S=def();
try{const t=localStorage.getItem('domeMaster2');if(t)S=Object.assign(def(),JSON.parse(t))}catch(e){}
S.show=Object.assign(def().show,S.show);
const $=id=>document.getElementById(id);
const P=(r,a)=>(CX+r*Math.cos(a)).toFixed(2)+' '+(CX+r*Math.sin(a)).toFixed(2);
const cp=r=>`M${CX-r} ${CX}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0z`;
const spXY=(s,i)=>{const t=s.n==1?0:s.o+360*i/s.n;return{t,x:CX+s.r*K*Math.sin(t*rad),y:CX-s.r*K*Math.cos(t*rad)}};
const cXY=(g,i)=>{const t=(S.az+90*i)*rad;return{x:CX+g.d*K*Math.sin(t),y:CX-g.d*K*Math.cos(t)}};
const spR=(s,p,x)=>`<rect x="${-s.w*K/2}" y="${-s.h*K/2}" width="${s.w*K}" height="${s.h*K}" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.t})" ${x}/>`;
let hv=null,T1='';const hist=[];
const snapS=()=>JSON.stringify(S);
const pushH=x=>{hist.push(x);if(hist.length>100)hist.shift()};
function undo(){if(!hist.length)return;const k={show:S.show,op:S.op};S=Object.assign(JSON.parse(hist.pop()),k);render()}
function bounds(){let fx=0,a=0,auto=0,sc=1,warn=0;
S.w.forEach(v=>v==null?a++:fx+=v);
if(a&&fx<100)auto=(100-fx)/a;else if(a){auto=.5;sc=(100-.5*a)/fx;warn=1}else{sc=100/fx;if(Math.abs(sc-1)>1e-6)warn=1}
const b=[0];S.w.forEach(v=>b.push(b[b.length-1]+(v==null?auto:v*sc)));return{b,auto,warn}}
function info(h){if(!h)return'Hover a panel ring, projector circle or speaker.';
if(h.t==='e')return`Edge of ring ${h.k+1}: drag to resize the ring (outer rings re-space)`;
if(h.t==='p')return`Panel: click = color, shift+drag = paint exit. Grab a ring edge to resize.`;
if(h.t==='c')return`Projectors ${h.g?'far':'near'}: drag = move to a different radius, alt+drag = rotate (ctrl snaps 15°)`;
const s=S.spk[h.r];return`Speaker ring ${h.r+1} (${s.n}): drag = move to a different radius, alt+drag = rotate (ctrl snaps 15°)${s.cap?', click = toggle LFE (max '+s.cap+')':''}`}
function drawH(){let h='';
if(hv){if(hv.t==='e'){const{b}=bounds();h=`<circle cx="${CX}" cy="${CX}" r="${b[hv.k+1]*K}" fill="none" stroke="#2f6fed" stroke-width="4"/>`}
else if(hv.t==='c'){const g=S.circ[hv.g];for(let i=0;i<4;i++){const c=cXY(g,i);h+=`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="${g.dia/2*K}" fill="rgba(245,158,11,.25)" stroke="#f59e0b" stroke-width="4"/>`}}
else{const s=S.spk[hv.r];for(let i=0;i<s.n;i++)h+=spR(s,spXY(s,i),'fill="none" stroke="#2f6fed" stroke-width="3"')}}
$('H').innerHTML=h}
function render(){const{b,auto,warn}=bounds();
S.lfe.forEach((a,r)=>S.lfe[r]=a.filter(i=>i<S.spk[r].n));
let h=`<g style="display:${S.show.p?'':'none'}">`;
N.forEach((m,k)=>{const ri=b[k]*K,ro=b[k+1]*K;for(let i=0;i<m;i++){let d;
if(!k)d=cp(ro);
else{const a0=-Math.PI/2+i*2*Math.PI/m,a1=a0+2*Math.PI/m;d=`M${P(ri,a0)}L${P(ro,a0)}A${ro} ${ro} 0 0 1 ${P(ro,a1)}L${P(ri,a1)}A${ri} ${ri} 0 0 0 ${P(ri,a0)}z`}
const id=k+'-'+i;h+=`<path data-id="${id}" d="${d}" fill="${C[S.col[id]||0]}" stroke="#000" stroke-width=".6"/>`}});
$('D1').innerHTML=h+'</g>';
h=`<g style="display:${S.show.c?'':'none'}">`;
S.circ.forEach(g=>{for(let i=0;i<4;i++){const c=cXY(g,i);h+=`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="${Math.max(0,g.dia/2*K)}" fill="none" stroke="#0a9b6e" stroke-width="2.5"/>`}});
h+=`</g><g style="display:${S.show.s?'':'none'}">`;
let num=0,nl=0;
S.spk.forEach((s,r)=>{for(let i=0;i<s.n;i++){num++;const p=spXY(s,i),L=S.lfe[r].includes(i);if(L)nl++;
h+=spR(s,p,`fill="${L?'#8b5cf6':'#ff8a3d'}" fill-opacity=".9" stroke="#333" stroke-width="1"`);
if(S.show.n)h+=`<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="${L?'#fff':'#000'}" font-family="Arial,Helvetica,sans-serif" pointer-events="none">${num}</text>`}});
$('D2').innerHTML=h+'</g>';
$('T').style.display=S.show.t?'':'none';$('T').setAttribute('opacity',S.op/100);
T1=num+' speakers · LFE '+nl+'/5';
cnt();drawH()}
document.querySelectorAll('[data-sh]').forEach(e=>{e.checked=!!S.show[e.dataset.sh];e.addEventListener('change',()=>{S.show[e.dataset.sh]=e.checked?1:0;render()})});
$('op').value=S.op;
$('tpi').setAttribute('href',TP);$('op').addEventListener('input',e=>{S.op=+e.target.value;render()});
const svg=$('s');svg.style.touchAction='none';let drag=null,pc=0,exitMode=false;
const pos=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)/r.width*680,(e.clientY-r.top)/r.height*680]};
const angOf=(x,y)=>Math.atan2(x-CX,CX-y)/rad;
function hit(x,y,pOnly){
if(!pOnly&&S.show.s)for(let r=S.spk.length-1;r>=0;r--){const s=S.spk[r];for(let i=0;i<s.n;i++){const p=spXY(s,i),dx=x-p.x,dy=y-p.y,c=Math.cos(p.t*rad),n=Math.sin(p.t*rad),u=dx*c+dy*n,v=-dx*n+dy*c;if(Math.abs(u)<=s.w*K/2&&Math.abs(v)<=s.h*K/2)return{t:'s',r,i}}}
if(!pOnly&&S.show.c){let best=null,bd=1e9;S.circ.forEach((g,gi)=>{for(let i=0;i<4;i++){const c=cXY(g,i),d=Math.hypot(x-c.x,y-c.y);if(d<=g.dia/2*K&&d<bd){bd=d;best={t:'c',g:gi,i}}}});if(best)return best}
if(!pOnly&&S.show.p){const{b}=bounds(),q=Math.hypot(x-CX,y-CX);let ee=null,ed=6;for(let j=1;j<=11;j++){const dj=Math.abs(q-b[j]*K);if(dj<ed){ed=dj;ee=j-1}}if(ee!==null)return{t:'e',k:ee}}
if(S.show.p){const rp=Math.hypot(x-CX,y-CX)/K;if(rp<=100){const{b}=bounds();let k=0;while(k<11&&rp>=b[k+1])k++;const m=N[k];let i=0;
if(k){const a=((Math.atan2(y-CX,x-CX)+Math.PI/2)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);i=Math.min(m-1,Math.floor(a/(2*Math.PI/m)))}return{t:'p',k,i}}}
return null}
function setCol(id,n){S.col[id]=n;const el=document.querySelector(`[data-id="${id}"]`);if(el)el.setAttribute('fill',C[n]);cnt()}
function paint(h){if(h&&h.t==='p'&&(S.col[h.k+'-'+h.i]||0)!==pc)setCol(h.k+'-'+h.i,pc)}
function freeze(k){const{b}=bounds();for(let j=0;j<k;j++)if(S.w[j]==null)S.w[j]=+(b[j+1]-b[j]).toFixed(2)}
svg.addEventListener('pointerdown',e=>{const[x,y]=pos(e);let h=hit(x,y);if(h&&h.t==='e'&&e.shiftKey)h=hit(x,y,true);if(!h)return;
const m=h.t==='e'?'edge':h.t==='p'?(e.shiftKey?'paint':'click'):(e.altKey?'rot':'dist');
const rp0=Math.hypot(x-CX,y-CX)/K;
drag={h,m,cx:e.clientX,cy:e.clientY,moved:false,snap:snapS(),a0:angOf(x,y),rp0,v0:h.t==='c'?S.az:h.t==='s'?S.spk[h.r].o:0,d0:h.t==='c'?S.circ[h.g].d:h.t==='s'?S.spk[h.r].r:0};
if(m==='paint'){pc=(S.col[h.k+'-'+h.i]||0)===4?0:4;paint(h)}
hv=h;drawH();svg.setPointerCapture(e.pointerId);e.preventDefault()});
svg.addEventListener('pointermove',e=>{const[x,y]=pos(e);
if(!drag){const h=hit(x,y);if(JSON.stringify(h)!==JSON.stringify(hv)){hv=h;drawH()}svg.style.cursor=h?(h.t==='e'?'nesw-resize':'pointer'):'';return}
const d=drag,h=d.h;
if(!d.moved&&d.m!=='paint'&&Math.hypot(e.clientX-d.cx,e.clientY-d.cy)<4)return;
d.moved=true;
const rp=Math.min(100,Math.hypot(x-CX,y-CX)/K),dd=Math.max(0,Math.min(100,d.d0+rp-d.rp0)),snap=a=>{if(e.ctrlKey)a=Math.round(a/15)*15;return+(((a%360)+360)%360).toFixed(1)};
if(d.m==='paint')paint(hit(x,y,true));
else if(h.t==='p'){}
else if(h.t==='e'){if(!d.fr){freeze(h.k);d.fr=1}const{b}=bounds();S.w[h.k]=+Math.max(.3,rp-b[h.k]).toFixed(2);render()}
else if(h.t==='c'){const g=S.circ[h.g];
if(d.m==='dist')g.d=+dd.toFixed(1);
else if(d.m==='rot')S.az=snap(d.v0+angOf(x,y)-d.a0);
render()}
else{const s=S.spk[h.r];
if(d.m==='dist'){if(s.n>1)s.r=+dd.toFixed(1)}
else if(d.m==='rot'){if(s.n>1)s.o=snap(d.v0+angOf(x,y)-d.a0)}
render()}});
function up(){if(!drag)return;const d=drag,h=d.h;drag=null;
if(!d.moved){if(h.t==='p'&&d.m==='click'){const id=h.k+'-'+h.i,v=S.col[id]||0;setCol(id,v>=3?0:v+1)}
else if(h.t==='s'&&d.m==='dist'&&S.spk[h.r].cap){const a=S.lfe[h.r],j=a.indexOf(h.i);if(j>=0)a.splice(j,1);else{a.push(h.i);if(a.length>S.spk[h.r].cap)a.shift()}render()}}
if(snapS()!==d.snap)pushH(d.snap)}
['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,up));
svg.addEventListener('pointerleave',()=>{if(!drag){hv=null;drawH()}});
function cnt(){}
const say=t=>{$('st').textContent=t;setTimeout(()=>$('st').textContent='',2500)};
function saveJSON(){const sp=[];let n=0;
S.spk.forEach((q,r)=>{for(let i=0;i<q.n;i++){n++;const t=q.n==1?0:q.o+360*i/q.n;sp.push({n,ring:r+1,azimuth:+(((t%360)+360)%360).toFixed(2),radius:q.r,x:+(q.r/100*Math.sin(t*rad)).toFixed(4),y:+(q.r/100*Math.cos(t*rad)).toFixed(4),lfe:S.lfe[r].includes(i)})}});
const pj=[];S.circ.forEach((g,gi)=>{for(let i=0;i<4;i++){const t=S.az+90*i;pj.push({group:gi?'far':'near',azimuth:+(((t%360)+360)%360).toFixed(2),radius:g.d,diameter:g.dia,x:+(g.d/100*Math.sin(t*rad)).toFixed(4),y:+(g.d/100*Math.cos(t*rad)).toFixed(4)})}});
return JSON.stringify({app:'sat-dome-master',version:3,units:'radii and sizes are % of dome radius (100 = dome edge); azimuth in degrees clockwise from top; x,y in dome radii with +y up',state:S,derived:{ringEdges:bounds().b.slice(1).map(v=>+v.toFixed(3)),speakers:sp,projectors:pj,exitPanels:Object.keys(S.col).filter(k=>S.col[k]===4)}},null,1)}
const keep=()=>({show:S.show,op:S.op});
function store(){try{localStorage.setItem('domeMaster2',JSON.stringify(S));return 1}catch(e){return 0}}
$('save').onclick=async()=>{const ok=store(),json=saveJSON();let f=0;try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'dome-master-save.json',data:json});f=1}}catch(e){}if(!f){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='dome-master-save.json';a.click();URL.revokeObjectURL(a.href);f=1}catch(e){}}say(f?'Saved + file':ok?'Saved':'Save failed')};
$('load').onclick=()=>$('lf').click();
$('lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),st=j.state||j;if(!st.spk||st.spk.length!==6||!st.lfe)throw 0;pushH(snapS());S=Object.assign(def(),st,keep());store();render();say('Loaded')}catch(x){say('Invalid save file')}};rd.readAsText(f);e.target.value=''};
$('rst').onclick=()=>{pushH(snapS());let st={};try{const t=localStorage.getItem('domeMaster2');if(t)st=JSON.parse(t)}catch(e){}S=Object.assign(def(),st,keep());render();say('Reset to last save')};
$('undo').onclick=undo;
$('clr').onclick=()=>{pushH(snapS());S.col={};render()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}});
render();
</script></body></html>
