function sph(az,el,r){az*=Math.PI/180;el*=Math.PI/180;return new THREE.Vector3(Math.sin(az)*Math.cos(el)*r,Math.sin(el)*r,-Math.cos(az)*Math.cos(el)*r);}

      for(let n=0;n<N;n++){const u=n/N,az=(a0+u*70+16*Math.sin(u*9+k))*Math.PI/180,el=Math.max(.12,(e0+22*Math.sin(u*5+k*2))*Math.PI/180);P.set([Math.sin(az)*Math.cos(el)*27.5,Math.sin(el)*27.5,-Math.cos(az)*Math.cos(el)*27.5],n*3);}
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(P,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:C[k],size:.8,map:DOT,transparent:true,alphaTest:.2,depthWrite:false}));
      const hd=new THREE.Mesh(new THREE.SphereGeometry(.6,12,8),new THREE.MeshBasicMaterial({color:C[k]}));G.add(pts,hd);it.push({pts,hd,P,N,off:k*1.4});}
    scene3.add(G);extras.push(G);tick=t=>it.forEach(o=>{const u=Math.min(1,(((t-o.off)%12+12)%12)/7),n=Math.max(1,Math.floor(u*o.N));o.pts.geometry.setDrawRange(0,n);o.hd.position.set(o.P[n*3-3],o.P[n*3-2],o.P[n*3-1]);o.hd.visible=u<1;});}
  if(idx==5){const T=[];for(let v=0;v<4;v++){const g=createGraphics(260,260);g.pixelDensity(1);box(g,260,260);bird(g,130,140,.95,v);const t=new THREE.CanvasTexture(g.elt);t.minFilter=THREE.LinearFilter;T.push(t);extras.push({geometry:{dispose(){}},dispose(){g.remove()}});extras.pop();}
    const D=[],s0=sph(-42,11,6);for(let k=0;k<14;k++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3),new THREE.MeshBasicMaterial({map:T[k%4],transparent:true}));scene3.add(m);extras.push(m);D.push({m,s:s0,t:sph(-165+k*25,12+(k*17)%55,13+(k*7)%6),rz:(k%5-2)*.12});}
    tick=t=>D.forEach((d,k)=>{const q=((t-k*.9)%14+14)%14,u=Math.min(1,q/4),e=u*u*(3-2*u),p=d.s.clone().lerp(d.t,e);p.y+=Math.sin(e*Math.PI)*3;d.m.position.copy(p);d.m.lookAt(0,0,0);d.m.rotateZ(d.rz*e);d.m.scale.setScalar(.2+.8*e);d.m.visible=q<13;});}
}
function draw(){
  const t=millis()/1000;
  cards.forEach((c,k)=>{const d=c.d;if(d.anim){d.draw(c.g,t);c.tex.needsUpdate=true;}
    if(d.fl){const a=d.az+Math.sin(t*.23+k*1.7)*d.fl,e=d.el+Math.sin(t*.31+k*2.3)*d.fl*.5;c.mesh.position.copy(sph(a,e,d.r||6));c.mesh.lookAt(0,0,0);c.mesh.rotateZ(d.rot||0);}});
  if(tick)tick(t);
  deco.forEach(m=>{const u=m.userData;m.position.copy(sph(u.az+t*u.sp,u.el+Math.sin(t*.4+u.az)*2,u.r));if(!u.sprite){m.rotation.x=t*.3*(1+u.s);m.rotation.y=t*.4;}});
  if(loop.visible){const c=((t%6)/6)*Math.PI/2*1.05;loop.ring.position.y=12*Math.cos(c);loop.ring.scale.setScalar(Math.max(.01,12*Math.sin(c)));
    const bc=1.45*Math.abs(Math.sin(t*.9)),ba=t*.8;loop.ball.position.set(Math.sin(ba)*Math.sin(bc)*12,Math.cos(bc)*12,-Math.cos(ba)*Math.sin(bc)*12);
    loop.items.forEach(m=>{const u=m.userData;if(Math.abs(c-u.c)<.05||m.position.distanceTo(loop.ball.position)<1.6)u.f=1;u.f*=.94;m.scale.setScalar(1+u.f*1.6);m.material.color.set(u.f>.35?'#ffffff':u.col);});}
  cubeCam.position.set(0,0,0);cubeCam.update(R,scene3);fishMat.uniforms.flip.value=flip;R.render(fishScene,fishCam);
  background(0);const s=width,x=drawingContext;x.save();x.beginPath();x.arc(s/2,s/2,s/2,0,Math.PI*2);x.clip();x.drawImage(R.domElement,0,0,s,s);x.restore();
  if(guides){noFill();stroke(255,255,255,60);strokeWeight(1);circle(s/2,s/2,s-1);noStroke();fill(255,255,255,120);textFont('Helvetica');textSize(11);textAlign(CENTER,BOTTOM);text('FRONT',s/2,s-6);textAlign(LEFT,TOP);text((idx+1)+' / 9 · '+FOV+'°',8,6);}
}
function keyPressed(){
  if(keyCode==RIGHT_ARROW)go(idx+1);else if(keyCode==LEFT_ARROW)go(idx-1);
  else if(key=='g'||key=='G')guides=!guides;else if(key=='m'||key=='M')flip*=-1;else if(key=='f'||key=='F')fullscreen(!fullscreen());
  else if(key=='s'||key=='S'){const a=document.createElement('a');a.download='domemaster_'+(idx+1)+'.png';a.href=R.domElement.toDataURL('image/png');a.click();}}
function windowResized(){const s=min(windowWidth,windowHeight);resizeCanvas(s,s);}
</script></body></html>
