const BG='#0b0c0e',FOV=210,RES=2048,CUBE=1024,PXPU=110;
const TX='#f5f6f8',TX2='#a7acb6',TX3='#71767f';
const PAL=[['#ff2f74','#ff9a3c'],['#ff9a3c','#ffd23f'],['#ffd23f','#7ee081'],['#3fbf6b','#22c9d6'],['#22c9d6','#4a7bff'],['#4a7bff','#a35cff'],['#a35cff','#ff2f74']];
const FONT='Inter,"Helvetica Neue",Helvetica,Arial,sans-serif';
const PACC=i=>PAL[((i%PAL.length)+PAL.length)%PAL.length];
let R,cubeRT,cubeCam,scene3,fishScene,fishCam,fishMat,SC,DOT,deco=[],cards=[],extras=[],loop,tick=null,idx=0,guides=true,flip=1,SCN=null,lastMs=0;
// ---------- small helpers ----------
function c2d(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return t;}
function lgx(c,x0,y0,x1,y1,cols){const g=c.createLinearGradient(x0,y0,x1,y1);cols.forEach((k,i)=>g.addColorStop(i/(cols.length-1),k));return g;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function polyShape(c,kind,x,y,r){c.beginPath();
 if(kind=='square')c.rect(x-r*.82,y-r*.82,r*1.64,r*1.64);
 else if(kind=='triangle'){c.moveTo(x,y-r*1.06);c.lineTo(x+r*1.02,y+r*.76);c.lineTo(x-r*1.02,y+r*.76);c.closePath();}
 else if(kind=='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.44:r*1.05;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
 else if(kind=='flower'){const q=5,n=q*20;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r*(.6+.4*Math.abs(Math.cos(q/2*a)));c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
 else c.arc(x,y,r,0,Math.PI*2);}
function blobPath(c,x,y,r,seed){c.beginPath();const n=30;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,w=1+.10*Math.sin(3*a+seed)+.05*Math.sin(5*a+seed*2.1);const px=x+Math.cos(a)*r*w,py=y+Math.sin(a)*r*w;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
 const sh=[16,8,0].map(s=>{const x=(A>>s&255)+(((B>>s&255)-(A>>s&255))*t);return Math.round(x).toString(16).padStart(2,'0');});
 return '#'+sh.join('');}
function track(c,px){if('letterSpacing' in c)c.letterSpacing=px;}
// ---------- text on the dome: no panels, French then English, an accent rule above ----------
function wrap(s,w,sz,wt){SC.drawingContext.font=wt+' '+sz+'px '+FONT;const o=[];let l='';
 s.split(' ').forEach(wd=>{const t=l?l+' '+wd:wd;if(SC.drawingContext.measureText(t).width>w&&l){o.push(l);l=wd}else l=t});o.push(l);return o;}
function tc(o){const sz=o.size||36,ld=Math.round(sz*1.3),gap=Math.round(sz*.9),bub=o.shape=='bubble';
 const tw=bub?Math.round((o.w||560)*.66):(o.w||560),pad=o.pad||46;
 const fl=o.fr?wrap(o.fr,tw,sz,'500'):[],en=o.en?wrap(o.en,tw,Math.round(sz*.86),'400'):[],tl=o.tail||[];
 const esz=Math.round(sz*.86),tsz=Math.round(sz*1.9),ksz=Math.round(sz*.58);
 let tf=tsz,twid=0;
 if(o.title){for(;;){SC.drawingContext.font='600 '+tf+'px '+FONT;twid=SC.drawingContext.measureText(o.title.toUpperCase()).width*1.06;if(twid<=(o.w||560)-2*pad||tf<=16)break;tf-=2;}}
 const th=(o.title?tf*1.18+gap:0)+fl.length*ld+(en.length?gap*.8+en.length*Math.round(esz*1.3):0)+(tl.length?gap+tl.length*Math.round(sz*.8*1.3):0);
 const lw=Math.max(sz*3,twid,...[...fl,...en,...tl].map(l=>{SC.drawingContext.font='500 '+sz+'px '+FONT;return SC.drawingContext.measureText(l).width;}));
 const shp=o.shape=='shape',R2=Math.round(Math.hypot(tw/2,th/2)*(o.sh=='circle'?1.06:o.sh=='square'?1.02:o.sh=='flower'?1.3:o.sh=='triangle'?1.4:1.55))+18;
 const W=shp?2*(R2+10):Math.min(tw,lw+Math.round(sz*.5))+2*pad,H=shp?2*(R2+10):th+2*pad;
 return Object.assign({},o,{w:W,h:H,draw:g=>{g.clear();const c=g.drawingContext;c.textBaseline='top';
  const ctr=o.align!='l',X=ctr?W/2:pad;c.textAlign=ctr?'center':'left';
  if(shp){const ac=PACC(o.accent||0);c.save();polyShape(c,o.sh,W/2,H/2,R2);
   c.fillStyle=lgx(c,W/2,H/2-R2,W/2,H/2+R2,[mixHex(ac[0],'#0b0c0e',.16),mixHex(ac[1],'#0b0c0e',.05)]);c.fill();
   c.lineWidth=3;c.strokeStyle=ac[0];c.stroke();c.restore();}
  let y=(H-th)/2;
  if(o.title){c.font='600 '+tf+'px '+FONT;c.fillStyle='#fff';track(c,'.05em');c.fillText(o.title.toUpperCase(),X,y);track(c,'0px');y+=tsz*1.18+gap;}
  c.font='500 '+sz+'px '+FONT;c.fillStyle='#fff';fl.forEach(l=>{c.fillText(l,X,y);y+=ld});
  if(en.length){y+=gap*.8;c.font='italic 400 '+esz+'px '+FONT;c.fillStyle='#fff';en.forEach(l=>{c.fillText(l,X,y);y+=Math.round(esz*1.3)});}
  if(tl.length){y+=gap;c.font='italic 400 '+Math.round(sz*.8)+'px '+FONT;c.fillStyle='#fff';tl.forEach(l=>{c.fillText(l,X,y);y+=Math.round(sz*.8*1.3)});}}});}

// ==========================================================================================================================
// THE INSTRUMENT'S ENGINE, ported from lab/instrument (#w6): the object model, the action -> dome-result pairs, the
// participants, the readers, the sound. The deck draws it in dome space: every mark, shape, bird and runner sits at its
// own azimuth and elevation inside the dome, and the only panel is the phone.
// ==========================================================================================================================
const D=Math.PI/180,wrap360=a=>((a%360)+360)%360;
const RHO=p=>Math.max(0,Math.min(1,(90-p.el)/90));                      // elevation -> distance out from the zenith
const SHAPES=['circle','triangle','square','star'];
const VALID={'Get':['becomes'],'Aim only':['count'],'Tap':['mark','leave','erase'],'Hold':['line','carry','erase'],'Answer':['tally','race'],'Send':['fly']};
const RS=18;                              // the radius the scene floats at inside the dome
const PR=140;                             // plan radius, for the instrument's plan-space maths
const GOAL=30,LOOP_MS=7000,BASE_EL=14,LANE_EL=10,LANE_STEP=3.4,MAXU=16;
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
const VOICE={mark:{wave:'triangle',mul:2,rel:.18,gain:.16,filter:5000},circle:{wave:'sine',mul:1,rel:.40,gain:.26,filter:7000},
 triangle:{wave:'square',mul:.5,rel:.16,gain:.14,filter:1800},square:{wave:'sawtooth',mul:.25,rel:.30,gain:.18,filter:900},
 star:{wave:'triangle',mul:1,rel:.55,gain:.22,filter:5000},drawing:{wave:'sine',mul:2,rel:.60,gain:.18,filter:6000},
 line:{wave:'sine',mul:2,rel:.60,gain:.16,filter:6000}};
let audio=null,soundOn=false,sndWanted=true;
function armSound(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state!=='running')audio.resume();soundOn=!!audio&&sndWanted;sndBtn();}
function toggleSound(){sndWanted=!sndWanted;if(sndWanted)armSound();else{soundOn=false;sndBtn();}}
function sndBtn(){const b=document.getElementById('snd');if(b)b.className='s'+(soundOn?'':' off');}
function note(type,rho,az,when){                     // pitched by elevation, panned by azimuth
 if(!soundOn||!audio)return;const vo=VOICE[type]||VOICE.mark,t0=(when||audio.currentTime)+.001,rel=vo.rel;
 const i0=Math.max(0,Math.min(SCALE.length-1,Math.floor((1-rho)*SCALE.length)));
 const g=audio.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vo.gain,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+rel);
 const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(vo.filter,t0);f.frequency.exponentialRampToValueAtTime(Math.max(250,vo.filter*.35),t0+rel);
 const o=audio.createOscillator();o.type=vo.wave;o.frequency.value=SCALE[i0]*vo.mul;o.connect(f);
 const p=audio.createStereoPanner?audio.createStereoPanner():null;
 if(p){p.pan.value=Math.sin(az*D)*.8;f.connect(g).connect(p).connect(audio.destination);}else f.connect(g).connect(audio.destination);
 o.start(t0);o.stop(t0+rel+.05);}
// ---------- shared drawing (the instrument's glyphs, in the deck's gradients and medium line) ----------
function iglyph(c,type,x,y,s,filled){c.beginPath();
 if(type=='triangle'){c.moveTo(x,y-s);c.lineTo(x+s*.87,y+s*.55);c.lineTo(x-s*.87,y+s*.55);c.closePath();}
 else if(type=='square'){c.rect(x-s*.75,y-s*.75,s*1.5,s*1.5);}
 else if(type=='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.46:s*1.05;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
 else c.arc(x,y,s*.78,0,Math.PI*2);
 filled?c.fill():c.stroke();}
function angleBetweenDeg(p,q){const c=Math.sin(p.el*D)*Math.sin(q.el*D)+Math.cos(p.el*D)*Math.cos(q.el*D)*Math.cos((p.az-q.az)*D);return Math.acos(Math.min(1,Math.max(-1,c)))/D;}
function sph(az,el,r){az*=D;el*=D;return new THREE.Vector3(Math.sin(az)*Math.cos(el)*r,Math.sin(el)*r,-Math.cos(az)*Math.cos(el)*r);}
function place(mesh,p){mesh.up.set(0,1,0);mesh.position.copy(p);mesh.lookAt(0,0,0);return mesh;}
function fromVec(v){const l=v.length()||1;return{az:wrap360(Math.atan2(v.x,-v.z)/D),el:Math.asin(Math.max(-1,Math.min(1,v.y/l)))/D};}
const proj=p=>{const rho=RHO(p);return{x:PR*rho*Math.sin(p.az*D),y:PR*rho*Math.cos(p.az*D)};};   // plan coords, +y = front
function ringPts(cx,cy,rx,ry,n){const o=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return o;}
// the drawing everyone makes in class, as the instrument's drawing object
const BIRD=[ringPts(.5,.56,.2,.13,18),ringPts(.7,.42,.075,.075,10),[[.755,.42],[.87,.45],[.755,.49]],[[.52,.52],[.36,.3],[.5,.37]],[[.3,.54],[.12,.45]],[[.45,.69],[.43,.83]],[[.57,.69],[.59,.83]]];
function buildObject(kind){
 if(kind=='draw')return{kind:'drawing',strokes:BIRD};
 if(kind=='write')return{kind:'text',text:'oiseau'};
 if(kind=='choose')return{kind:'shape',shape:'triangle'};
 return{kind:'shape',shape:SHAPES[Math.floor(Math.random()*4)]};}
// ---------- one scene per demo slide, each an instrument action -> dome result pair ----------
const SCENES=[{kind:'line',act:'Hold',res:'line'},{kind:'loopers',act:'Aim only',res:'count'},{kind:'fly',act:'Send',res:'fly'},
 {kind:'poll',act:'Answer',res:'tally'},{kind:'race',act:'Answer',res:'race'}];
function makeScene(n){const S=Object.assign({grp:new THREE.Group(),marks:[],strokes:[],flying:[],bots:[],votes:[0,0,0,0],pending:[],runners:[],winner:null,
 phase:0,prevPhase:0,t:0,acc:0,stroke:null,timer:6,sparks:[],cubes:[],warn:null},SCENES[n]);
 S.grp.name='scene';scene3.add(S.grp);
 if(!VALID[S.act].includes(S.res)){S.warn=S.act+' -> no '+S.res;console.warn(S.warn);}
 if(S.kind=='line')for(let k=0;k<3;k++){const az=Math.random()*360,el=20+Math.random()*50;   // already aimed: the first stroke starts on frame one
  S.bots.push({i:k,az:az,el:el,ta:{az:az,el:el},state:'to',t:0,stroke:null});}
 if(S.kind=='fly')for(let k=0;k<3;k++)S.bots.push({i:k,az:-40+k*40,el:14,obj:buildObject('draw'),t:.15+k*.15});
 if(S.kind=='poll'){S.cubes=[];
  for(let i=0;i<4;i++){const az=-54+i*36,st=[];
   for(let k=0;k<MAXU;k++){const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:new THREE.Color(PACC(i)[1])}));m.visible=false;S.grp.add(m);st.push(m);}
   S.cubes.push({az:az,list:st,base:glyphMesh('shape',SHAPES[i],i,3.6)});
   place(S.cubes[i].base,sph(az,BASE_EL+1,RS-.2));S.grp.add(S.cubes[i].base);}}
 if(S.kind=='race'){S.runners=[];
  for(let i=0;i<6;i++)S.runners.push({i:i,id:'p'+(i+1),p:0,rate:2.5+Math.random()*4,acc:0,az0:-26,
   mesh:glyphMesh('shape',SHAPES[i%4],i,2.6),trail:[]});
  S.runners.forEach(r=>{S.grp.add(r.mesh);});
  // the track: one hairline ring per lane, and the badge that names the winner
  for(let i=0;i<7;i++){const el=LANE_EL-1.7+i*LANE_STEP,rr=RS*Math.sin((90-el)*D),yy=RS*Math.cos((90-el)*D);
   const ring=new THREE.Mesh(new THREE.TorusGeometry(rr,.022,6,160),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:i<6?.16:.1}));
   ring.rotation.x=Math.PI/2;ring.position.y=yy;S.grp.add(ring);}
  S.badge=winnerMesh(COPY.win[0],0,2.4);S.badge.visible=false;S.grp.add(S.badge);}
 return S;}
function disposeScene(S){if(!S)return;scene3.remove(S.grp);
 S.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});}
// ---------- stickers: a glyph, a bird, a word ----------
function shapeCanvas(shape,i,px,mark){const cv=c2d(px,px),c=cv.getContext('2d');
 c.fillStyle=mark?mixHex(PACC(i)[0],'#0b0c0e',.42):lgx(c,px*.1,px*.1,px*.9,px*.9,PACC(i));
 c.strokeStyle=mixHex(PACC(i)[0],'#0b0c0e',.5);c.lineWidth=px*.055;iglyph(c,shape,px/2,px/2,px*.32,true);c.stroke();
 return cv;}
function birdCanvas(i,px){const cv=c2d(px,px),c=cv.getContext('2d');c.lineCap='round';c.lineJoin='round';
 c.strokeStyle=lgx(c,0,0,px,px,PACC(i));c.lineWidth=px*.052;
 BIRD.forEach(st=>{c.beginPath();st.forEach(([x,y],k)=>{const a=x*px*.84+px*.08,b=y*px*.84+px*.08;k?c.lineTo(a,b):c.moveTo(a,b);});c.stroke();});
 return cv;}
function glyphMesh(kind,shape,i,size){const cv=shapeCanvas(shape,i,256,kind=='mark');
 return new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({map:tex(cv),transparent:true,side:THREE.DoubleSide}));}
function birdMesh(i,size){return new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshBasicMaterial({map:tex(birdCanvas(i,256)),transparent:true,side:THREE.DoubleSide}));}
function wordMesh(text,i,size){const m0=c2d(8,8).getContext('2d');m0.font='600 64px '+FONT;const tw=m0.measureText(text).width;
 const cv=c2d(Math.ceil(tw+60),96),c=cv.getContext('2d');
 c.beginPath();rrect(c,3,3,cv.width-6,90,16);c.fillStyle='rgba(255,255,255,.06)';c.fill();c.lineWidth=3;c.strokeStyle=lgx(c,3,3,cv.width-3,93,PACC(i));c.stroke();
 c.font='600 60px '+FONT;c.fillStyle=TX;c.textAlign='center';c.textBaseline='middle';c.fillText(text,cv.width/2,50);
 const ar=cv.width/cv.height;return new THREE.Mesh(new THREE.PlaneGeometry(size*ar,size),new THREE.MeshBasicMaterial({map:tex(cv),transparent:true,side:THREE.DoubleSide}));}
// ---------- a line drawn on the dome, as a tube (medium linework) ----------
function strokeTube(S,st){const n=st.length;if(n<2)return;
 if(st._tube&&st._n==n)return;
 if(st._tube){S.grp.remove(st._tube);st._tube.geometry.dispose();}
 const pts=st.map(q=>sph(q.az,q.el,RS-.5));
 const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),Math.min(140,n*3),.21,7,false);
 st._tube=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:new THREE.Color(PACC(st.i)[0])}));
 S.grp.add(st._tube);st._n=n;}
// ---------- the instrument's actions, taken by a participant's aim ----------
function eraseAt(S,p){const P0=proj(p),near=q=>{const Q=proj(q);return Math.hypot(Q.x-P0.x,Q.y-P0.y)<16;};
 const was=S.marks.length+S.strokes.length;
 S.marks=S.marks.filter(m=>{if(near(m)){if(m.mesh){S.grp.remove(m.mesh);m.mesh.geometry.dispose();}return false;}return true;});
 S.strokes=S.strokes.filter(st=>{if(st.some(q=>near(q))){if(st._tube){S.grp.remove(st._tube);st._tube.geometry.dispose();}return false;}return true;});
 return was-S.marks.length-S.strokes.length;}
function sDown(S,at,i){const st=[{az:at.az,el:at.el}];st.i=i;S.strokes.push(st);
 if(S.strokes.length>9){const old=S.strokes.shift();if(old._tube){S.grp.remove(old._tube);old._tube.geometry.dispose();}}
 return st;}

    if(d.fl){const a=d.az+Math.sin(t*.23+k*1.7)*d.fl,e=d.el+Math.sin(t*.31+k*2.3)*d.fl*.5;place(c.mesh,sph(a,e,d.r||6));c.mesh.rotateZ(d.rot||0);}});

  deco.forEach(m=>{const u=m.userData;m.position.copy(sph(u.az+Math.sin(t*.07+u.s*3)*9,u.el+Math.sin(t*.4+u.az)*2,u.r));m.rotation.x=t*.3*(1+u.s);m.rotation.y=t*.4;});
  if(loop.visible&&SCN){const rho=SCN.phase,R0=RS-.5,el=90*(1-rho);   // same parameterisation the trigger reads
    loop.ring.position.y=R0*Math.sin(el*D);loop.ring.scale.setScalar(Math.max(.01,R0*Math.cos(el*D)));
    loop.items.forEach(m=>{const u=m.userData;u.f*=.93;m.scale.setScalar(.9+u.f*.7);m.material.color.set(u.f>.45?u.hot:u.col);});}
  cubeCam.position.set(0,0,0);cubeCam.update(R,scene3);fishMat.uniforms.flip.value=flip;R.render(fishScene,fishCam);
  background(0);const s=width,x=drawingContext;x.save();x.beginPath();x.arc(s/2,s/2,s/2,0,Math.PI*2);x.clip();x.drawImage(R.domElement,0,0,s,s);x.restore();
  if(guides){noFill();stroke(255,255,255,55);strokeWeight(1);circle(s/2,s/2,s-1);noStroke();fill(255,255,255,120);textFont('Inter,Helvetica,Arial,sans-serif');textSize(11);textAlign(CENTER,BOTTOM);text('FRONT',s/2,s-6);textAlign(LEFT,TOP);
   text((idx+1)+' / 9 · '+FOV+'°'+(SCN?' · '+SCN.act.toLowerCase()+' → '+SCN.res:'')+(SCN&&SCN.kind=='loopers'?' · rho '+SCN.phase.toFixed(2):'')+(SCN&&SCN.warn?' · '+SCN.warn:''),10,8);}
}
function keyPressed(){
  if(keyCode==RIGHT_ARROW)go(idx+1);else if(keyCode==LEFT_ARROW)go(idx-1);
  else if(key=='g'||key=='G')guides=!guides;else if(key=='m'||key=='M')flip*=-1;else if(key=='f'||key=='F')fullscreen(!fullscreen());
  else if(key=='s'||key=='S'){const a=document.createElement('a');a.download='domemaster_'+(idx+1)+'.png';a.href=R.domElement.toDataURL('image/png');a.click();}}
function windowResized(){const s=min(windowWidth,windowHeight);resizeCanvas(s,s);}
