<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>domebase/sketch/pinball</title>
<link rel="stylesheet" href="../looper.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>

<header class="crumb"><h1><a href="../../">domebase</a>/<a href="../">sketch</a>/pinball</h1></header>

<div id="sketch1"></div>
<div class="controls" id="ctrl1"></div>

<script src="../looper.js"></script>
<script>
// ---- instantiate -----------------------------------------------------
const config = { ringsCount: 5, splitsCount: 8,
                 quantize: false,      // pinball placement is always free-form
                 direction: 'outward', // fixed; unused by physics, kept for shared code
                 dropIntervalMs: 1200, gravity: 520, bounce: 0.72,
                 activeVoiceIndex: 0, showChannelNumbers: true,
                 stepDurationMs: 350 };
const voices = defaultVoices();
const playState = { playing: true };
const opts = { mode: 'pinball', config: config, voices: voices,
               playState: playState, minR: 0, maxR: SIZE / 2 };

createLooperSketch('sketch1', opts);
buildControlsFor('ctrl1', 'PINBALL / GRAVITY', opts, 'pinball');
</script>
</body>
</html>
