<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>domebase/lab/3d math</title>
<link rel="stylesheet" href="../../assets/css/site.css">
<style>/* 3d math — this page only. A fullscreen domemaster: the circle is inscribed in the
   viewport, the centre of the circle is the zenith and the rim is the horizon. The menu is not in
   the scene: it is a patch of the dome, low on the front left — the spot lab/pitch gives its phone
   — drawn over the canvas and warped onto that patch, so it sits on the dome and stays editable.
   Its placement is locked: computed once from a fixed 180 degrees, and again on resize only.
   H hides and shows it. */
#stage{position:fixed;inset:0;background:#fff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#stage .say{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:12.5px}
#crumb{position:fixed;left:0;top:0;z-index:4;padding:9px 12px;background:#fff;
  border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
/* the menu: 330 x 190 css px of layout, warped onto the dome patch by placeMenu(). transform-origin
   is the box's own top left, so the matrix maps straight onto page coordinates. */
#menu{position:fixed;left:0;top:0;transform-origin:0 0;z-index:3;
  display:grid;grid-template-columns:1fr 0.72fr;grid-template-rows:1fr 1fr;
  width:300px;height:150px;background:rgba(255,255,255,.95);border:1.5px solid var(--line);
  font-size:8px;line-height:1.15}
#menu > .pane{overflow:auto;min-width:0;min-height:0}
#pane-shapes{grid-column:1;grid-row:1 / 3;border-right:1px solid var(--line)}
#pane-params{grid-column:2;grid-row:1;border-bottom:1px solid var(--line)}
#pane-view{grid-column:2;grid-row:2}
.pane .ph{position:sticky;top:0;z-index:2;background:var(--head);border-bottom:1px solid var(--line);
  padding:0 3px;font-weight:700;font-size:8px}
table{width:100%;table-layout:fixed}
#index th,#params th{cursor:default}
#index td,#index th,#params td,#params th{padding:0 3px;font-size:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.n,th.n{text-align:right}
tr.row.on td{background:var(--head);font-weight:700}
/* shapes: the name column at half width, the pane full height, the names cut off as needed */
#index th:nth-child(1),#index td:nth-child(1){width:50%}
#index th:nth-child(2),#index td:nth-child(2){width:18%}
#index th:nth-child(3),#index td:nth-child(3){width:17%}
#index th:nth-child(4),#index td:nth-child(4){width:15%}
/* parameters: an eighth of the panel's width a column, and everything cuts off rather than spills */
#params th:nth-child(1),#params td:nth-child(1){width:42%}
#params th:nth-child(2),#params td:nth-child(2){width:26%}
#params th:nth-child(3),#params td:nth-child(3){width:16%}
#params th:nth-child(4),#params td:nth-child(4){width:16%}
#params input[type=number]{width:26px;padding:0 1px;text-align:right;font-size:8px}
#params input.p{width:20px;border-color:var(--hair);font-size:7px}
#params select{width:100%;max-width:44px;padding:0;font-size:7px}
td.k{white-space:nowrap}
#viewbody{padding:1px 2px;display:flex;flex-wrap:wrap;gap:0 3px;align-items:center;line-height:1.1}
#viewbody input[type=number]{width:24px;padding:0;text-align:right;font-size:8px}
#viewbody select{font-size:8px;max-width:40px;padding:0}
#viewbody .chk{white-space:nowrap}
</style>
</head>
<body class="app">

<div id="stage"><canvas id="cv"></canvas></div>

<header id="crumb"><h1><a href="../../">domebase</a>/<a href="../">lab</a>/3d math</h1></header>

<div id="menu">
  <div class="pane" id="pane-shapes">
    <div class="ph">shapes</div>
    <table id="index">
      <thead><tr><th>shape</th><th class="n">verts</th><th class="n">lines</th><th class="n">tris</th></tr></thead>
      <tbody id="indexbody"></tbody>
    </table>
  </div>

  <div class="pane" id="pane-params">
    <div class="ph">parameters</div>
    <table id="params">
      <thead><tr><th>parameter</th><th class="n">value</th><th>sweep</th><th class="n">s</th></tr></thead>
      <tbody id="parambody"></tbody>
    </table>
  </div>

  <div class="pane" id="pane-view">
    <div class="ph">view</div>
    <div id="viewbody">
      <label class="chk"><input type="checkbox" id="spin" checked>spin</label>
      <label class="chk"><input type="checkbox" id="sweep">animate</label>
      <label class="chk"><input type="checkbox" id="depth" checked>depth</label>
      <label class="chk"><input type="checkbox" id="edges" checked>edges</label>
      <label class="chk"><input type="checkbox" id="faces" checked>faces</label>
      <label class="chk">colour<select id="colour"><option value="0">off</option><option value="1">data</option><option value="2" selected>normal</option></select></label>
      <label class="chk">fov<input type="number" id="fov" value="180" min="90" max="300" step="5">°</label>
      <label class="chk">size<input type="number" id="size" value="1.45" min="1.1" max="4" step="0.05"></label>
      <label class="chk"><input type="checkbox" id="guides" checked>guides</label>
      <button class="pill" id="front">front</button>
      <span class="count" id="count"></span>
    </div>
  </div>

<script src="geom.js"></script>
<script>/* the registry every family file pushes its shapes into */
const SHAPES3D = { list: [], define: function (d) { this.list.push(d); } };</script>
<script src="fam_polytopes.js"></script>
<script src="fam_packing.js"></script>
<script src="fam_fractal.js"></script>
<script src="fam_surface.js"></script>
<script src="fam_curve.js"></script>
<script src="fam_attractor.js"></script>
<script src="fam_dome.js"></script>
<script src="viewer.js"></script>
</body>
</html>
