<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>domebase/lab/3d math</title>
<link rel="stylesheet" href="../../assets/css/site.css">
<style>/* 3d math — this page only. A fullscreen domemaster: the circle is inscribed in the
   viewport, the centre of the circle is the zenith, and the rim is the horizon, which is how a
   master is addressed. The menu is not in the scene: it is a 2d layer placed in the master's own
   coordinates, on the dome's back wall — the top of the master, altitudes 18-72 — and it stays there while
   the shape turns underneath it. It is drawn with its up pointing at the zenith, which is the way
   round it reads on a dome, so on the master it sits upside down. The circle's corners are free
   at 16:9, and the breadcrumb holds the top left one. */
:root{--menu-w:488px}
#stage{position:fixed;inset:0;background:#fff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#stage .say{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:12.5px}
#crumb{position:fixed;left:0;top:0;z-index:4;padding:9px 12px;background:#fff;
  border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
/* the menu: 488 css px of layout, placed and scaled by placeMenu(). transform-origin is its own
   centre, so the rotation is about the middle of the block. */
#menu{position:fixed;left:50%;top:50%;z-index:3;transform-origin:50% 50%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  width:var(--menu-w);height:270px;background:rgba(255,255,255,.95);
  border:2px solid var(--line);font-size:10px;line-height:1.15}
#menu > *{overflow:auto;min-width:0;min-height:0}
.pane{border-top:1px solid var(--line);border-left:1px solid var(--line)}
#pane-shapes{border-top:0;border-left:0}
#pane-params{border-top:0}
#pane-view{border-left:0}
.pane .ph{position:sticky;top:0;z-index:2;background:var(--head);border-bottom:1px solid var(--line);
  padding:0 4px;font-weight:700;font-size:10px}
table{width:100%}
#index th,#params th,#spec th{cursor:default}
#index td,#index th,#params td,#params th,#spec td,#spec th{padding:0 4px;font-size:10px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.row.on td{background:var(--head);font-weight:700}
#colour{margin-left:5px;padding:0 2px}
#params input[type=number]{width:46px;padding:0 2px;text-align:right;font-size:10px}
#params input.p{width:34px;border-color:var(--hair)}
#params select{max-width:96px;padding:0 1px;font-size:10px}
td.k{white-space:nowrap}
#spec td.v{text-align:right;white-space:nowrap}
#spec a{text-decoration:none;border-bottom:1px solid var(--hair)}
#viewbody{padding:2px 4px;display:flex;flex-wrap:wrap;gap:0 7px;align-items:center}
#viewbody input[type=number]{width:42px;padding:0 2px;text-align:right;font-size:10px}
</style>
</head>
<body class="app">

<div id="stage"><canvas id="cv"></canvas></div>

<header id="crumb"><h1><a href="../../">domebase</a>/<a href="../">lab</a>/3d math</h1></header>

<div id="menu">
  <div class="pane" id="pane-shapes">
    <div class="ph">shapes</div>
    <table id="index">
      <thead><tr><th>shape</th><th class="n">verts</th><th class="n">lines</th><th class="n">tris</th></tr></thead>
      <tbody id="indexbody"></tbody>
    </table>
  </div>

  <div class="pane" id="pane-params">
    <div class="ph">parameters</div>
    <table id="params">
      <thead><tr><th>parameter</th><th class="n">value</th><th>sweep</th><th class="n">s</th></tr></thead>
      <tbody id="parambody"></tbody>
    </table>
  </div>

  <div class="pane" id="pane-view">
    <div class="ph">view</div>
    <div id="viewbody">
      <label class="chk"><input type="checkbox" id="spin" checked>spin</label>
      <label class="chk"><input type="checkbox" id="sweep">animate</label>
      <label class="chk"><input type="checkbox" id="depth" checked>depth</label>
      <label class="chk"><input type="checkbox" id="edges" checked>edges</label>
      <label class="chk"><input type="checkbox" id="faces" checked>faces</label>
      <label class="chk">colour<select id="colour" style="font-size:10px"><option value="0">off</option><option value="1">data</option><option value="2" selected>normal</option></select></label>
      <label class="chk"><input type="checkbox" id="dome" checked>dome</label>
      <label class="chk">fov<input type="number" id="fov" value="180" min="90" max="300" step="5">°</label>
      <label class="chk">size<input type="number" id="size" value="1.45" min="1.1" max="4" step="0.05"></label>
      <label class="chk"><input type="checkbox" id="guides" checked>guides</label>
      <button class="pill" id="front">front</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="pane" id="pane-measures">
    <div class="ph">measures</div>
    <table id="spec">
      <thead><tr><th>measure</th><th class="n">value</th></tr></thead>
      <tbody id="specbody"></tbody>
    </table>
  </div>
</div>

<script src="geom.js"></script>
<script>/* the registry every family file pushes its shapes into */
const SHAPES3D = { list: [], define: function (d) { this.list.push(d); } };</script>
<script src="fam_polytopes.js"></script>
<script src="fam_packing.js"></script>
<script src="fam_fractal.js"></script>
<script src="fam_surface.js"></script>
<script src="fam_curve.js"></script>
<script src="fam_attractor.js"></script>
<script src="fam_dome.js"></script>
<script src="viewer.js"></script>
</body>
</html>
