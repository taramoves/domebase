let R,cubeRT,cubeCam,scene3,fishScene,fishCam,fishMat,SC,DOT,deco=[],cards=[],extras=[],loop,tick=null,idx=0,guides=true,flip=1,SCN=null,lastMs=0;

// ---------- text cards: black on white, French first, English italic below ----------
function wrap(s,w,sz,it){SC.textFont(F.b);SC.textSize(sz);SC.textStyle(it?ITALIC:NORMAL);const o=[];let l='';s.split(' ').forEach(wd=>{const t=l?l+' '+wd:wd;if(SC.textWidth(t)>w&&l){o.push(l);l=wd}else l=t});o.push(l);return o;}
function tc(o){const sz=o.size||36,ld=sz*1.3,gap=sz*.8,tw=o.w||500,P=24,pad=40,bub=o.shape=='bubble',c=o.align!='l';
 const fl=o.fr?wrap(o.fr,tw,sz,0):[],en=o.en?wrap(o.en,tw,sz,1):[],tl=o.tail||[],tsz=sz*2;
 const th=(o.title?tsz*1.3+gap:0)+fl.length*ld+(en.length?gap+en.length*ld:0)+(tl.length?gap*1.2+tl.length*ld:0);
 const W=bub?tw/.7+2*P:tw+2*pad+2*P,H=bub?th/.62+2*P:th+2*pad+2*P;
 return Object.assign({},o,{w:W,h:H,draw:g=>{g.clear();const x=g.drawingContext;x.save();x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=22;x.shadowOffsetY=10;g.fill(o.bg||'#fff');
  if(bub){g.stroke(INK);g.strokeWeight(6);g.ellipse(W/2,H/2,W-2*P,H-2*P);}else{g.noStroke();g.rect(P,P,W-2*P,H-2*P,5);}x.restore();
  g.noStroke();g.fill(INK);g.textAlign(c?CENTER:LEFT,TOP);let y=(H-th)/2;const X=c?W/2:P+pad;
  if(o.title){g.textFont(F.d);g.textStyle(NORMAL);g.textSize(tsz);g.text(o.title,X,y);y+=tsz*1.3+gap;}
  g.textFont(F.b);g.textSize(sz);g.textStyle(NORMAL);fl.forEach(l=>{g.text(l,X,y);y+=ld});
  if(en.length){y+=gap;g.textStyle(ITALIC);en.forEach(l=>{g.text(l,X,y);y+=ld});g.textStyle(NORMAL);}
  if(tl.length){y+=gap*1.2;tl.forEach(l=>{g.text(l,X,y);y+=ld});}}});}
function cardBox(g,W,H){g.clear();const x=g.drawingContext;x.save();x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=22;x.shadowOffsetY=10;g.fill('#fff');g.noStroke();g.rect(24,24,W-48,H-48,5);x.restore();g.fill(INK);g.textFont(F.b);g.textAlign(LEFT,TOP);}
function bi(g,p,x,y,sz,al){g.textAlign(al||LEFT,TOP);g.textFont(F.b);g.textSize(sz);g.fill(INK);g.textStyle(NORMAL);g.text(p[0],x,y);g.textStyle(ITALIC);g.text(p[1],x,y+sz*1.25);g.textStyle(NORMAL);}

// ==========================================================================================================================
// THE INSTRUMENT'S ENGINE, ported from lab/instrument (#w6): the object model, the action -> dome-result pairs, the
// simulated participants, the readers, the sound. Same state, same constants; the deck draws it in dome space
// (each thing sits at its own azimuth and elevation on the sphere) instead of the instrument's top-down plan.
// ==========================================================================================================================
const D=Math.PI/180,wrap360=a=>((a%360)+360)%360;
const RHO=p=>Math.max(0,Math.min(1,(90-p.el)/90));                      // elevation -> distance out from the zenith
const SHAPES=['circle','triangle','square','star'];
const ACTIONS=['Get','Aim only','Tap','Hold','Answer','Send'];
const VALID={'Get':['becomes'],'Aim only':['count'],'Tap':['mark','leave','erase'],'Hold':['line','carry','erase'],'Answer':['tally','race'],'Send':['fly']};
const RS=18;                              // the radius the scene floats at inside the dome
const PR=140;                             // plan radius, for the ping-pong physics (the instrument's R)
const GOAL=30,LOOP_MS=7000,DROP_MS=1400,GRAV=360,BOUNCE=.72,BALL_R=5,PEG_R=12;
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
const VOICE={mark:{wave:'triangle',mul:2,rel:.18,gain:.16,filter:5000},circle:{wave:'sine',mul:1,rel:.40,gain:.26,filter:7000},
 triangle:{wave:'square',mul:.5,rel:.16,gain:.14,filter:1800},square:{wave:'sawtooth',mul:.25,rel:.30,gain:.18,filter:900},
 star:{wave:'triangle',mul:1,rel:.55,gain:.22,filter:5000},word:{wave:'sawtooth',mul:.5,rel:.22,gain:.12,filter:1400},
 text:{wave:'sawtooth',mul:.5,rel:.22,gain:.12,filter:1400},drawing:{wave:'sine',mul:2,rel:.60,gain:.18,filter:6000},
 photo:{wave:'sine',mul:.5,rel:.50,gain:.14,filter:1200},line:{wave:'sine',mul:2,rel:.60,gain:.16,filter:6000}};
let audio=null,soundOn=false,sndWanted=true;
function armSound(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state!=='running')audio.resume();soundOn=!!audio&&sndWanted;sndBtn();}
function toggleSound(){sndWanted=!sndWanted;if(sndWanted)armSound();else{soundOn=false;sndBtn();}}
function sndBtn(){const b=document.getElementById('snd');if(b)b.className='s'+(soundOn?'':' off');}
function note(type,rho,az,when){                     // pitched by elevation, panned by azimuth
 if(!soundOn||!audio)return;const vo=VOICE[type]||VOICE.mark,t0=(when||audio.currentTime)+.001,rel=vo.rel;
 const i0=Math.max(0,Math.min(SCALE.length-1,Math.floor((1-rho)*SCALE.length)));
 const g=audio.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vo.gain,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+rel);
 const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(vo.filter,t0);f.frequency.exponentialRampToValueAtTime(Math.max(250,vo.filter*.35),t0+rel);
 const o=audio.createOscillator();o.type=vo.wave;o.frequency.value=SCALE[i0]*vo.mul;o.connect(f);
 const p=audio.createStereoPanner?audio.createStereoPanner():null;
 if(p){p.pan.value=Math.sin(az*D)*.8;f.connect(g).connect(p).connect(audio.destination);}else f.connect(g).connect(audio.destination);
 o.start(t0);o.stop(t0+rel+.05);}
// ---------- shared drawing: the instrument's helpers. The deck draws on dark ground, so the ink is passed in ----------
function c2d(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return t;}
function iglyph(c,type,x,y,s,filled){c.beginPath();
 if(type=='triangle'){c.moveTo(x,y-s);c.lineTo(x+s*.87,y+s*.55);c.lineTo(x-s*.87,y+s*.55);c.closePath();}
 else if(type=='square'){c.rect(x-s*.75,y-s*.75,s*1.5,s*1.5);}
 else if(type=='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.46:s*1.05;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
 else c.arc(x,y,s*.78,0,Math.PI*2);
 filled?c.fill():c.stroke();}
function angleBetweenDeg(p,q){const c=Math.sin(p.el*D)*Math.sin(q.el*D)+Math.cos(p.el*D)*Math.cos(q.el*D)*Math.cos((p.az-q.az)*D);return Math.acos(Math.min(1,Math.max(-1,c)))/D;}
function sph(az,el,r){az*=D;el*=D;return new THREE.Vector3(Math.sin(az)*Math.cos(el)*r,Math.sin(el)*r,-Math.cos(az)*Math.cos(el)*r);}
function fromVec(v){const l=v.length()||1;return{az:wrap360(Math.atan2(v.x,-v.z)/D),el:Math.asin(Math.max(-1,Math.min(1,v.y/l)))/D};}
const proj=p=>{const rho=RHO(p);return{x:PR*rho*Math.sin(p.az*D),y:PR*rho*Math.cos(p.az*D)};};   // plan coords, +y = front
function paintStrokes(c,list,size,lw,col){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
 list.forEach(st=>{g.beginPath();st.forEach(([x,y],i)=>i?g.lineTo(x*size,y*size):g.moveTo(x*size,y*size));if(st.length===1)g.lineTo(st[0][0]*size+.1,st[0][1]*size);g.stroke();});}
function drawObjAt(c,obj,x,y,size,col){c.save();c.translate(x,y);c.strokeStyle=col;c.fillStyle=col;c.lineCap='round';c.lineJoin='round';
 if(obj.kind=='shape')iglyph(c,obj.shape,0,0,size*.42,true);
 else if(obj.kind=='text'){c.font=Math.max(14,size*.2)+'px '+F.b;const tw=c.measureText(obj.text).width;c.fillStyle=WHT;c.fillRect(-tw/2-7,-17,tw+14,34);c.strokeStyle=col;c.lineWidth=1.6;c.strokeRect(-tw/2-7,-17,tw+14,34);c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(obj.text,0,0);}
 else if(obj.kind=='drawing'){c.lineWidth=Math.max(2,size*.05);obj.strokes.forEach(st=>{c.beginPath();st.forEach(([sx,sy],i)=>{const a=(sx-.5)*size,b=(sy-.5)*size;i?c.lineTo(a,b):c.moveTo(a,b);});c.stroke();});}
 else{c.drawImage(obj.img,-size*.42,-size*.42,size*.84,size*.84);c.lineWidth=1.6;c.strokeRect(-size*.42,-size*.42,size*.84,size*.84);}
 c.restore();}
function ringPts(cx,cy,rx,ry,n){const o=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return o;}
// everyone draws a bird: the instrument's drawing object, holding the class's bird
const BIRD=[ringPts(.5,.56,.2,.13,18),ringPts(.7,.42,.075,.075,10),[[.755,.42],[.87,.45],[.755,.49]],[[.52,.52],[.36,.3],[.5,.37]],[[.3,.54],[.12,.45]],[[.45,.69],[.43,.83]],[[.57,.69],[.59,.83]]];
function makePhoto(){const c=c2d(120,120),g=c.getContext('2d');g.fillStyle='#ddd';g.fillRect(0,0,120,120);
 for(let i=0;i<8;i++){const k=Math.floor(40+Math.random()*170).toString(16).padStart(2,'0');g.fillStyle='#'+k+k+k;g.beginPath();
  if(Math.random()<.5)g.arc(Math.random()*120,Math.random()*120,8+Math.random()*28,0,Math.PI*2);else g.rect(Math.random()*110,Math.random()*110,10+Math.random()*45,10+Math.random()*45);g.fill();}return c;}
function buildObject(kind){
 if(kind=='draw')return{kind:'drawing',strokes:BIRD};
 if(kind=='write')return{kind:'text',text:'oiseau'};
 if(kind=='photo')return{kind:'photo',img:makePhoto()};
 if(kind=='choose')return{kind:'shape',shape:'triangle'};
 return{kind:'shape',shape:SHAPES[Math.floor(Math.random()*4)]};}         // 'assigned'
// ---------- one scene per demo slide, each an instrument action -> dome result pair ----------
const SCENES=[{kind:'line',obj:'none',act:'Hold',res:'line'},{kind:'readers',obj:'none',act:'Aim only',res:'mark'},
 {kind:'fly',obj:'draw',act:'Send',res:'fly'},{kind:'carry',obj:'grab',act:'Hold',res:'carry'},{kind:'poll',obj:'none',act:'Answer',res:'tally'}];
function makeScene(n){const S=Object.assign({grp:new THREE.Group(),marks:[],objs:[],words:[],strokes:[],flying:[],balls:[],bots:[],votes:[0,0,0,0],pending:[],runners:[],winner:null,
 phase:0,prevPhase:0,dropTimer:0,reader:'action',t:0,acc:0,stroke:null,held:null,timer:14,fireT:0,tallyT:14,warn:null,ballPool:[]},SCENES[n]);
 S.grp.name='scene';scene3.add(S.grp);
 if(!VALID[S.act].includes(S.res)){S.warn=S.act+' -> no '+S.res;console.warn(S.warn);}
 if(S.kind=='line')for(let k=0;k<3;k++)S.bots.push({az:Math.random()*360,el:20+Math.random()*50,state:'idle',t:Math.random()*2,stroke:null});
 if(S.kind=='fly')for(let k=0;k<3;k++)S.bots.push({az:-40+k*40,el:14,obj:buildObject('draw'),t:Math.random()*3});
 if(S.kind=='carry'){COPY.words.slice(0,5).forEach((w,k)=>S.words.push({kind:'word',text:w[0],az:40+k*70,el:20+(k%2)*28,holder:null,flash:0}));
  for(let k=0;k<3;k++)S.bots.push({az:Math.random()*360,el:30+Math.random()*40,state:'seek',word:null,goal:null,wait:0,home:{az:150+k*80,el:26+(k%2)*26}});}
 if(S.kind=='poll')for(let i=0;i<6;i++)S.runners.push({id:'p'+(i+1),p:0,rate:2.5+Math.random()*4,acc:0});
 if(S.kind=='readers')for(let k=0;k<12;k++){const m=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));m.visible=false;S.grp.add(m);S.ballPool.push(m);}
 return S;}
function disposeScene(S){if(!S)return;scene3.remove(S.grp);
 S.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});}
function dropItem(S,it){if(it.mesh){S.grp.remove(it.mesh);if(it.tex)it.tex.dispose();it.mesh.geometry.dispose();it.mesh.material.dispose();it.mesh=null;}}
// ---------- the instrument's actions, taken by a participant's aim ----------
function eraseAt(S,p){const P0=proj(p),near=q=>{const Q=proj(q);return Math.hypot(Q.x-P0.x,Q.y-P0.y)<16;};
 const was=S.marks.length+S.strokes.length+S.objs.length;
 S.marks=S.marks.filter(m=>{if(near(m)){dropItem(S,m);return false;}return true;});
 S.strokes=S.strokes.filter(st=>{if(st.some(q=>near(q))){if(st._m){S.grp.remove(st._m);st._m.geometry.dispose();st._m=null;}return false;}return true;});
 S.objs=S.objs.filter(o=>{if(near(o)){dropItem(S,o);return false;}return true;});
 return was-S.marks.length-S.strokes.length-S.objs.length;}
function sDown(S,at,now){if(S.res=='line'){const st=[{az:at.az,el:at.el}];S.strokes.push(st);if(S.strokes.length>10){const old=S.strokes.shift();if(old._m){S.grp.remove(old._m);old._m.geometry.dispose();}}return st;}
 if(S.res=='erase'){const n=eraseAt(S,at);if(n)note('line',RHO(at),at.az);}
 if(S.res=='carry'&&S.obj=='grab'){let best=null;S.words.forEach(w=>{if(w.holder)return;const d=angleBetweenDeg(at,w);if(d<28&&(!best||d<best.d))best={w,d}});
  S.held=best?best.w:null;if(S.held){S.held.holder='sim';note('word',RHO(at),at.az);}}
 return null;}
function sUp(S,now){if(S.res=='carry'&&S.held){note('word',RHO(S.held),S.held.az);S.held.flash=now+260;S.held.holder=null;S.held=null;}}
function sounders(S){const out=[];
 if(S.kind=='readers'){loop.items.forEach(m=>out.push({p:fromVec(m.position),type:m.userData.shape||'mark',ref:m,mesh:1}));return out;}
 S.marks.forEach(m=>out.push({p:m,type:'mark',ref:m}));
 S.objs.forEach(o=>out.push({p:o,type:o.obj.kind=='shape'?o.obj.shape:o.obj.kind,ref:o}));
 S.words.forEach(w=>{if(!w.holder)out.push({p:w,type:'word',ref:w});});
 S.strokes.forEach(st=>{if(!st.length)return;let x=0,y=0,z=0;
  st.forEach(q=>{x+=Math.sin(q.az*D)*Math.cos(q.el*D);y+=Math.sin(q.el*D);z+=-Math.cos(q.az*D)*Math.cos(q.el*D);});
  out.push({p:fromVec(new THREE.Vector3(x,y,z)),type:'line',ref:st});});
 S.flying.forEach(f=>out.push({p:f,type:f.obj.kind=='shape'?f.obj.shape:f.obj.kind,ref:f}));
 return out;}
function fire(S,it,now){it.ref.flash=now+260;if(it.ref.userData)it.ref.userData.f=1;note(it.type,RHO(it.p),it.p.az);}
// ---------- one frame of a scene ----------
function aimTo(b,g,dt,k){b.az=wrap360(b.az+(((g.az-b.az+540)%360)-180)*Math.min(1,dt*k));b.el+=(g.el-b.el)*Math.min(1,dt*k);}
function near(b,g,tol){return Math.abs(((g.az-b.az+540)%360)-180)<(tol||2)&&Math.abs(g.el-b.el)<(tol||2);}
function stepScene(S,dt,now,k){
 if(k=='line'){S.bots.forEach(b=>{
   if(b.state=='idle'){b.t-=dt;if(b.t<=0){b.ta={az:Math.random()*360,el:14+Math.random()*58};b.state='to';}}
   else if(b.state=='to'){aimTo(b,b.ta,dt,1.1);if(near(b,b.ta,2.5)){b.home={az:b.az,el:b.el};b.stroke=sDown(S,{az:b.az,el:b.el},now);b.state='draw';b.n=0;b.ta={az:b.az+(Math.random()*2-1)*80,el:Math.max(12,Math.min(78,b.el+(Math.random()*2-1)*45))};}}
   else if(b.state=='draw'){aimTo(b,b.ta,dt,1.5);const q={az:b.az,el:b.el};
     if(b.stroke&&angleBetweenDeg(b.stroke[b.stroke.length-1],q)>1.2)b.stroke.push(q);
     S.stroke=b.stroke;
     if(++b.n>110||near(b,b.ta,3)){b.stroke=null;S.stroke=null;b.state='idle';b.t=.6+Math.random()*1.4;}}});
  S.t+=dt;if(S.t>26){S.t=0;S.strokes.forEach(st=>{if(st._m){S.grp.remove(st._m);st._m.geometry.dispose();}});S.strokes=[];}}
 if(k=='readers'){
  if(S.reader=='action'){S.fireT-=dt;if(S.fireT<=0){S.fireT=.5+Math.random()*.9;const a=sounders(S);if(a.length)fire(S,a[Math.floor(Math.random()*a.length)],now);}
   S.timer-=dt;if(S.timer<=0){S.reader='concentric';S.phase=0;S.prevPhase=0;S.timer=14;}}

    tick=()=>lines.forEach((l,k)=>{const a=cards[k].mesh.position.clone().normalize(),b=cards[k+1].mesh.position.clone().normalize(),p=l.geometry.attributes.position;
      for(let n=0;n<20;n++){const v=a.clone().lerp(b,n/19).setLength(6.8);p.setXYZ(n,v.x,v.y,v.z);}p.needsUpdate=true;});}
  if(idx==3){const G=new THREE.Group(),it=[],C=[0xffffff,0xffe45c,0xff5a4d,0x3fa7ff,0xffffff,0x35c46b,0xffe45c],N=140;
    for(let k=0;k<7;k++){const a0=-150+k*52+Math.random()*20,e0=25+Math.random()*40,P=new Float32Array(N*3);
      for(let n=0;n<N;n++){const u=n/N,az=(a0+u*70+16*Math.sin(u*9+k))*Math.PI/180,el=Math.max(.12,(e0+22*Math.sin(u*5+k*2))*Math.PI/180);P.set([Math.sin(az)*Math.cos(el)*27.5,Math.sin(el)*27.5,-Math.cos(az)*Math.cos(el)*27.5],n*3);}
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(P,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:C[k],size:.4,map:DOT,transparent:true,opacity:.55,alphaTest:.2,depthWrite:false}));
      const hd=new THREE.Mesh(new THREE.SphereGeometry(.6,12,8),new THREE.MeshBasicMaterial({color:C[k]}));G.add(pts,hd);it.push({pts,hd,P,N,off:k*1.4});}
    scene3.add(G);extras.push(G);tick=t=>it.forEach(o=>{const u=Math.min(1,(((t-o.off)%12+12)%12)/7),n=Math.max(1,Math.floor(u*o.N));o.pts.geometry.setDrawRange(0,n);o.hd.position.set(o.P[n*3-3],o.P[n*3-2],o.P[n*3-1]);o.hd.visible=u<1;});}
}
function draw(){
  const t=millis()/1000,now=performance.now(),dt=lastMs?Math.min(.05,(now-lastMs)/1000):0;lastMs=now;
  if(SCN){stepScene(SCN,dt,now,SCN.kind);syncScene(SCN,now);}
  cards.forEach((c,k)=>{const d=c.d;if(d.anim){d.draw(c.g,t);c.tex.needsUpdate=true;}
    if(d.fl){const a=d.az+Math.sin(t*.23+k*1.7)*d.fl,e=d.el+Math.sin(t*.31+k*2.3)*d.fl*.5;c.mesh.position.copy(sph(a,e,d.r||6));c.mesh.lookAt(0,0,0);c.mesh.rotateZ(d.rot||0);}});
  if(tick)tick(t);
  deco.forEach(m=>{const u=m.userData;m.position.copy(sph(u.az+t*u.sp,u.el+Math.sin(t*.4+u.az)*2,u.r));if(!u.sprite){m.rotation.x=t*.3*(1+u.s);m.rotation.y=t*.4;}});
  if(loop.visible){const c=((t%6)/6)*Math.PI/2*1.05;loop.ring.position.y=12*Math.cos(c);loop.ring.scale.setScalar(Math.max(.01,12*Math.sin(c)));
    const bc=1.45*Math.abs(Math.sin(t*.9)),ba=t*.8;loop.ball.position.set(Math.sin(ba)*Math.sin(bc)*12,Math.cos(bc)*12,-Math.cos(ba)*Math.sin(bc)*12);
    loop.items.forEach(m=>{const u=m.userData;u.f*=.94;m.scale.setScalar(1+u.f*1.6);m.material.color.set(u.f>.35?'#ffffff':u.col);});}
  cubeCam.position.set(0,0,0);cubeCam.update(R,scene3);fishMat.uniforms.flip.value=flip;R.render(fishScene,fishCam);
  background(0);const s=width,x=drawingContext;x.save();x.beginPath();x.arc(s/2,s/2,s/2,0,Math.PI*2);x.clip();x.drawImage(R.domElement,0,0,s,s);x.restore();
  if(guides){noFill();stroke(255,255,255,60);strokeWeight(1);circle(s/2,s/2,s-1);noStroke();fill(255,255,255,120);textFont('Helvetica');textSize(11);textAlign(CENTER,BOTTOM);text('FRONT',s/2,s-6);textAlign(LEFT,TOP);
   text((idx+1)+' / 9 · '+FOV+'°'+(SCN?' · '+SCN.act.toLowerCase()+' \u2192 '+SCN.res:'')+(SCN&&SCN.kind=='readers'?' · reader: '+SCN.reader:'')+(SCN&&SCN.warn?' · '+SCN.warn:''),8,6);}
}
function keyPressed(){
  if(keyCode==RIGHT_ARROW)go(idx+1);else if(keyCode==LEFT_ARROW)go(idx-1);
  else if(key=='g'||key=='G')guides=!guides;else if(key=='m'||key=='M')flip*=-1;else if(key=='f'||key=='F')fullscreen(!fullscreen());
  else if(key=='s'||key=='S'){const a=document.createElement('a');a.download='domemaster_'+(idx+1)+'.png';a.href=R.domElement.toDataURL('image/png');a.click();}}
function windowResized(){const s=min(windowWidth,windowHeight);resizeCanvas(s,s);}
</script></body></html>
